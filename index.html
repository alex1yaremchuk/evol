<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#247d74" />
    <title>Основные развилки эволюции</title>
    <link rel="icon" href="assets/icons/evol-icon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="assets/icons/evol-icon-32.png" type="image/png" sizes="32x32" />
    <link rel="apple-touch-icon" href="assets/icons/evol-icon-180.png" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <a class="home-link" href="./?section=new-timelines&amp;lang=ru" aria-label="Главная">
      <span aria-hidden="true">Evol</span>
    </a>
    <header class="scheme-nav" id="scheme-nav" aria-label="Схемы"></header>
    <div class="top-tools">
      <div class="language-switch" role="group" aria-label="Язык">
        <button class="language-button" type="button" data-lang="ru" aria-pressed="true">RUS</button>
        <button class="language-button" type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
      <a class="contact-link" href="mailto:alexander.yaremchuk@gmail.com" title="alexander.yaremchuk@gmail.com">
        <span class="contact-icon" aria-hidden="true">✉</span>
        <span class="contact-text">Написать</span>
      </a>
    </div>

    <main class="deck" id="deck" aria-live="polite">
      <section class="slide-shell" id="slide"></section>
    </main>

    <nav class="controls" aria-label="Навигация по слайдам">
      <button class="nav-button" id="prev" type="button" aria-label="Предыдущий слайд">
        <span aria-hidden="true">‹</span>
      </button>
      <div class="progress" aria-label="Номер слайда">
        <span id="current">1</span>
        <span>/</span>
        <span id="total">1</span>
      </div>
      <button class="nav-button" id="next" type="button" aria-label="Следующий слайд">
        <span aria-hidden="true">›</span>
      </button>
    </nav>

    <script src="data.js"></script>
    <script src="games.js"></script>
    <script src="evolution-model.js"></script>
    <script src="earth-history.js"></script>
    <script src="i18n-en.js"></script>
    <script src="i18n-model-en.js"></script>
    <script src="app.js"></script>
  </body>
</html>
